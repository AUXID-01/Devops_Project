apiVersion: v1
kind: Service
metadata:
  name: bugboard-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bugboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "bugboard.selectorLabels" . | nindent 4 }}
    app: frontend
