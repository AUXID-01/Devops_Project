{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: bugboard-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bugboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "bugboard.selectorLabels" . | nindent 4 }}
    app: postgres
{{- end -}}
