apiVersion: v1
kind: ConfigMap
metadata:
  name: bugboard-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bugboard.labels" . | nindent 4 }}
data:
  UPLOAD_DIR: {{ .Values.backend.env.UPLOAD_DIR | quote }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | quote }}
