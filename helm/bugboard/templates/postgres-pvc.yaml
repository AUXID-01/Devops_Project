{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bugboard-postgres-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bugboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.storage }}
{{- end -}}
